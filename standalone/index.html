<style>
*{box-sizing:border-box;margin:0;padding:0}

<script>
// ===== POLYGON DATA =====
const POLY = {
1:[["ICT1112","70,345 125,365 75,520 15,495"],["ICT1111","125,365 175,385 135,545 75,520"],["ICT1110","175,385 235,410 205,570 135,545"],["ICT1109","235,410 300,440 275,600 205,570"],["ICT1108","300,440 440,440 440,600 275,600"],["ICT1107","440,440 555,440 555,600 440,600"],["ICT1106","620,380 680,380 680,600 620,600"],["ICT1105","680,380 740,380 740,600 680,600"],["ICT1104/1","740,380 810,380 810,600 740,600"],["ICT1104","810,380 875,380 910,600 810,600"],["ICT1103/1","875,380 940,350 990,555 910,600"],["ICT1103","940,350 1000,325 1060,515 990,555"],["ICT1102/1","1000,325 1060,300 1125,480 1060,515"],["ICT1102","1060,300 1100,280 1175,455 1125,480"]],

3:[["ICT1352","395,275 505,310 475,385 370,350"],["ICT1355","605,320 640,320 640,355 605,355"],["ICT1356","640,320 675,320 675,355 640,355"],["ICT1357","675,320 705,320 705,355 675,355"],["ICT1359","565,375 735,375 745,395 650,445 555,395"],["ICT1340","255,605 345,635 300,765 210,725"],["ICT1334","345,635 430,665 405,795 300,765"],["ICT1328","430,665 535,670 535,800 405,795"],["ICT1323","535,670 635,670 635,800 535,800"],["ICT1318","685,625 780,625 795,800 685,800"],["ICT1312","780,625 880,615 915,795 795,800"],["ICT1307","880,615 990,575 1050,745 915,795"],["ICT1302","990,575 1100,535 1165,695 1050,745"]],
4:[["ICT1439","125,455 225,495 180,620 75,570"],["ICT1434","225,495 335,535 315,670 180,620"],["ICT1429","335,535 455,540 455,670 315,670"],["ICT1424","455,540 570,540 570,670 455,670"],["ICT1419/1","630,485 690,485 690,690 630,690"],["ICT1419","690,485 745,485 745,690 690,690"],["ICT1413/1","745,485 805,485 805,690 745,690"],["ICT1413","805,485 860,475 905,690 805,690"],["ICT1407","860,475 970,440 1050,630 905,690"],["ICT1402","970,440 1080,400 1150,600 1050,630"]]
};
const ROOMS=[];
for(let f=1;f<=4;f++)POLY[f].forEach(p=>ROOMS.push({code:p[0],floor:f,pts:p[1]}));
function center(pts){const c=pts.split(' ').map(p=>p.split(',').map(Number));const n=c.length;return{x:c.reduce((s,v)=>s+v[0],0)/n,y:c.reduce((s,v)=>s+v[1],0)/n}}
function wing(code){const e=+code.slice(3,4);return e<=2?'right':e>=6?'left':(+code.slice(-2)<=10?'left':'right')}
function rs(code){return wing(code)==='left'?'ปีกซ้าย':'ปีกขวา'}
// ===== STATE =====
let cf=1,sr='',er='',sr2='',er2='',sh=false,rr=null,md='start',hr='';
// ===== DOM =====
const $=id=>document.getElementById(id);
const si=$('si'),ei=$('ei'),ss=$('ss'),es=$('es'),gb=$('gb'),rb=$('rb'),dc=$('dc'),dhr=$('dhr'),dd=$('dd'),dsx=$('dsx'),cb=$('cb'),rsvg=$('rs'),sd=$('sd'),ed=$('ed'),es0=$('es0'),fl=$('fl'),rt=$('rt'),mv=$('mv');
// ===== FLOOR TABS =====
const ft=$('ft');ft.innerHTML='';for(let f=1;f<=4;f++){const b=document.createElement('button');b.className='ftb';b.textContent='ชั้น '+f;b.onclick=()=>{document.querySelectorAll('.ftb').forEach(x=>x.classList.remove('on'));b.classList.add('on');cf=f;showFloor(f)};ft.appendChild(b)}document.querySelector('.ftb').classList.add('on');
// ===== SUGGESTIONS =====
function getSugs(q){const u=q.toUpperCase();if(!u)return[];return ROOMS.filter(r=>r.code.includes(u)).slice(0,8)}
function showS(c,inp,m){c.innerHTML='';const s=getSugs(inp.value);if(!s.length){c.style.display='none';return}md=m;s.forEach(r=>{const b=document.createElement('button');b.className='si';b.innerHTML='<span class="cd">'+r.code+'</span><span class="mt">ชั้น '+r.floor+'</span>';b.onmousedown=()=>{inp.value=r.code;if(md==='start')sr=r.code;else er=r.code;c.style.display='none';if(sr&&er)go()};c.appendChild(b)});c.style.display='block'}
si.addEventListener('input',()=>showS(ss,si,'start'));si.addEventListener('focus',()=>showS(ss,si,'start'));si.addEventListener('blur',()=>setTimeout(()=>ss.style.display='none',200));
ei.addEventListener('input',()=>showS(es,ei,'end'));ei.addEventListener('focus',()=>showS(es,ei,'end'));ei.addEventListener('blur',()=>setTimeout(()=>es.style.display='none',200));
si.addEventListener('keydown',e=>{if(e.key==='Enter'){const s=ss.querySelector('.si');if(s)s.click();else if(si.value){sr=si.value;ei.focus()}}});
ei.addEventListener('keydown',e=>{if(e.key==='Enter'){const s=es.querySelector('.si');if(s)s.click();else if(ei.value){er=ei.value;go()}}});
function pick(c){si.value=c;sr=c;ei.focus()}
// ===== ROUTE =====
function go(){const s=sr||si.value,e=er||ei.value;if(!s||!e)return;if(s===e){alert('⛔ ต้องเป็นคนละห้อง');return}
const sf=+s[4],ef=+e[4];const dir=sf<ef?'ขึ้น':'ลง';const d=Math.abs(ef-sf);const st=[];const fl=new Set();
if(sf===ef){st.push({t:'walk',txt:'เดินจาก '+s+' ไป '+e+' ในชั้น '+sf,f:sf});fl.add(sf)}
else{const ns=wing(s)==='left'?'ซ้าย':'ขวา',ne=wing(e)==='left'?'ซ้าย':'ขวา'
st.push({t:'walk',txt:'เดินจาก '+s+' ไปลิฟต์'+ns+' (ชั้น '+sf+')',f:sf});fl.add(sf)
st.push({t:'lift',txt:'🛗 ขึ้นลิฟต์'+dir+'ไปชั้น '+ef+' ('+d+' ชั้น)'})
for(let m=Math.min(sf,ef)+1;m<Math.max(sf,ef);m++)fl.add(m)
st.push({t:'walk',txt:'ถึงชั้น '+ef+' เดินจากลิฟต์'+ne+' ไป '+e,f:ef});fl.add(ef)}
st.push({t:'arr',txt:'📍 ถึง '+e+' ชั้น '+ef+' แล้ว'});rr={steps:st,floors:[...fl].sort()};sh=true;sr=s;er=e;render();renderDirs(st,s,e)}
function clearR(){sh=false;rr=null;sr='';er='';si.value='';ei.value='';rsvg.innerHTML='';sd.style.display='none';ed.style.display='none';dc.style.display='none';rb.className='rb';es0.style.display='block'}
cb.addEventListener('click',clearR);
// ===== RENDER =====
function xfr(f){cf=f;document.querySelectorAll('.ftb').forEach(b=>b.classList.toggle('on',+b.textContent.replace(/[^\d]/g,'')===f));showFloor(f)}
function render(){const s=sr,e=er;if(!rr)return;rsvg.innerHTML='';sd.style.display='none';ed.style.display='none';
const img=mv.querySelector('img[style*="block"]');if(!img)return;
// Draw room polygons
const ns='http://www.w3.org/2000/svg';
(POLY[cf]||[]).forEach(p=>{const code=p[0],pts=p[1];const poly=document.createElementNS(ns,'polygon');poly.setAttribute('points',pts);
const isStart=code===sr,isEnd=code===er,isHover=code===hr;
let fill='transparent',stroke='transparent',sw='0.5';
if(isStart){fill='rgba(46,125,50,0.25)';stroke='#2e7d32';sw='2'}
else if(isEnd){fill='rgba(211,47,47,0.25)';stroke='#d32f2f';sw='2'}
else if(isHover){fill='rgba(21,101,192,0.15)';stroke='#1565c0';sw='1.5'}
poly.setAttribute('fill',fill);poly.setAttribute('stroke',stroke);poly.setAttribute('stroke-width',sw);
poly.style.cursor='pointer';poly.style.transition='all .15s';
const title=document.createElementNS(ns,'title');title.textContent=code;poly.appendChild(title);
poly.addEventListener('mouseenter',()=>{hr=code;showFloor(cf)});
poly.addEventListener('mouseleave',()=>{hr='';showFloor(cf)});
poly.addEventListener('click',()=>{if(!sr||er){si.value=code;sr=code;ei.focus()}else{pick(code)}});
rsvg.appendChild(poly);
// Room label
const c=center(pts);
const txt=document.createElementNS(ns,'text');txt.setAttribute('x',c.x);txt.setAttribute('y',c.y);
txt.setAttribute('text-anchor','middle');txt.setAttribute('dominant-baseline','middle');
txt.setAttribute('font-size',code.includes('/')?'9':'11');txt.setAttribute('fill','#444');
txt.setAttribute('font-weight',(isStart||isEnd||isHover)?'bold':'500');
txt.style.pointerEvents='none';txt.style.textShadow='0 0 3px white,0 0 6px white';
txt.textContent=code.replace('ICT','');rsvg.appendChild(txt)});
// Elevator markers
[[180,250,'ลิฟต์ซ้าย'],[1020,250,'ลิฟต์ขวา']].forEach(e=>{
const g=document.createElementNS(ns,'g');
const r=document.createElementNS(ns,'rect');r.setAttribute('x',e[0]-18);r.setAttribute('y',e[1]-18);r.setAttribute('width','36');r.setAttribute('height','36');r.setAttribute('rx','6');r.setAttribute('fill','#1565c0');r.setAttribute('opacity','0.85');r.setAttribute('stroke','#fff');r.setAttribute('stroke-width','2');g.appendChild(r);
const t=document.createElementNS(ns,'text');t.setAttribute('x',e[0]);t.setAttribute('y',e[1]+1);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','20');t.setAttribute('fill','#fff');t.textContent='🛗';g.appendChild(t);
const tl=document.createElementNS(ns,'text');tl.setAttribute('x',e[0]);tl.setAttribute('y',e[1]+22);tl.setAttribute('text-anchor','middle');tl.setAttribute('font-size','9');tl.setAttribute('fill','#1565c0');tl.setAttribute('font-weight','bold');tl.textContent=e[2];g.appendChild(tl);
rsvg.appendChild(g)});
// Start/end dots
const sc=ROOMS.find(r=>r.code===sr&&r.floor===cf)||ROOMS.find(r=>r.code===sr);
const ec=ROOMS.find(r=>r.code===er&&r.floor===cf)||ROOMS.find(r=>r.code===er);
if(sc){const c=center(sc.pts);sd.style.left=(c.x/1200*100)+'%';sd.style.top=(c.y/840*100)+'%';sd.style.display='block'}
if(ec){const c=center(ec.pts);ed.style.left=(c.x/1200*100)+'%';ed.style.top=(c.y/840*100)+'%';ed.style.display='block'}}
function renderDirs(st,s,e){dc.style.display='block';es0.style.display='none';const sf=+s[4],ef=+e[4];dhr.innerHTML='🟢 '+s+' → 🔴 '+e;
const dd2=$('dd');const ws=wing(s),we=wing(e);const nws=ws==='left'?'ปีกซ้าย':'ปีกขวา',nwe=we==='left'?'ปีกซ้าย':'ปีกขวา';const dets=[];
if(sf===ef){dets.push('🚶 ออกจาก <b>'+s+'</b> ('+nws+')');dets.push('➡️ '+(ws===we?'ตรงไปตามทางเดิน':'เดินข้ามไป'+nwe));dets.push('📍 ถึง <b>'+e+'</b> ('+nwe+')'+(we==='left'?' อยู่ซ้ายมือ':' อยู่ขวามือ'))}
else{const dir=sf<ef?'ขึ้น':'ลง';const ns=ws==='left'?'ซ้าย':'ขวา',ne=we==='left'?'ซ้าย':'ขวา'
dets.push('🚶 ออกจาก <b>'+s+'</b> ('+nws+', ชั้น '+sf+')');dets.push('➡️ เดินไปลิฟต์ฝั่ง'+ns);dets.push('🛗 ขึ้นลิฟต์'+dir+'ไป <b>ชั้น '+ef+'</b> ('+Math.abs(ef-sf)+' ชั้น)')
